<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Speaker-VR AR</title>
<script src="./js/aframe.min.js"></script>
<script src="./js/mindar-image-aframe.prod.js"></script>
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; }
a-scene { width:100%; height:100%; display:block; }
</style>
</head>
<body>

<a-scene mindar-image="imageTargetSrc: ./targets-2.mind; smooth: true; smoothCount: 10;" embedded color-space="sRGB" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
  <a-camera mindar-image-camera></a-camera>
  <a-entity mindar-image-target="targetIndex: 0">
    <a-entity id="enceinte-parent" position="0 0 0" visible="false">
      <a-entity id="enceinte" scale="0.01 0.01 0.01">
        <a-entity id="back" obj-model="obj: ./assets/Back.obj" position="-20.15299 4.74877 -54.67917" rotation="0 90 0" material="color:#ffff80"></a-entity>
        <a-entity id="Left" obj-model="obj: ./assets/Left.obj" position="-31.10108 62.18591 -69.24553" rotation="0 0 90" material="color:#8080c0"></a-entity>
        <a-entity id="Right" obj-model="obj: ./assets/Right.obj" position="-89.76148 21.65531 21.74075" rotation="0 0 -90" material="color:#8000ff"></a-entity>
        <a-entity id="Batteries" obj-model="obj: ./assets/Batteries.obj" position="-78.80972 35.7123 9.96086" rotation="-89.9996 -88.5827 0" material="color:#80ffff"></a-entity>
        <a-entity id="Open" obj-model="obj: ./assets/Open.obj" position="-43.66647 18.64757 -44.24839" rotation="0 90 0" material="color:#ffff00"></a-entity>
        <a-entity id="Speaker" obj-model="obj: ./assets/Speaker.obj" position="-85.89407 11.82067 7.85191" rotation="0 -90 0" material="color:#ff8000"></a-entity>
        <a-entity id="Led" obj-model="obj: ./assets/led.obj" position="-59.96779 77.85118 -19.66102" rotation="0 0 0" material="color:#0080c0"></a-entity>
        <a-entity id="partie-avant" obj-model="obj: ./assets/partie-avant.obj" position="-107.78422 29.11701 -19.38373" rotation="-90 90 0" material="color:#ff0000"></a-entity>
        <a-entity id="bas" obj-model="obj: ./assets/bas.obj" position="-59.65366 -18.19764 -19.1577" rotation="0 90 0" material="side: double; color:#ff80c0"></a-entity>
      </a-entity>
    </a-entity>
  </a-entity>
</a-scene>

<script>
AFRAME.registerComponent('look-at-camera',{
  tick: function(){
    const camera=document.querySelector('a-camera');
    if(camera) this.el.object3D.lookAt(camera.object3D.position);
  }
});

document.addEventListener('DOMContentLoaded',()=>{
  const parent=document.querySelector('#enceinte-parent');
  const enceinte=document.getElementById('enceinte');

  const components=[
    {id:'back',offset:{x:0,y:0,z:-200}},
    {id:'Left',offset:{x:-180,y:60,z:0}},
    {id:'Right',offset:{x:180,y:60,z:0}},
    {id:'Batteries',offset:{x:120,y:-70,z:80}},
    {id:'Open',offset:{x:-90,y:40,z:-130}},
    {id:'Speaker',offset:{x:-80,y:-30,z:200}},
    {id:'Led',offset:{x:0,y:180,z:0}},
    {id:'partie-avant',offset:{x:80,y:30,z:240}},
    {id:'bas',offset:{x:0,y:-130,z:0}}
  ];

  const originalData={}; // gardera les positions/rotations *initiales* (capturées une seule fois)
  let looping = false;
  let explodeTimeout = null;

  const particlesContainer=document.createElement('a-entity');
  particlesContainer.setAttribute('id','particles-container');
  enceinte.appendChild(particlesContainer);

  // Capture initiale une seule fois : lit object3D (position finale réelle si le model est chargé).
  function captureOriginalDataOnce(){
    components.forEach(comp=>{
      if(originalData[comp.id]) return; // déjà capturé
      const el=document.getElementById(comp.id);
      if(!el) return;
      // Si object3D disponible (modèle chargé), prend les valeurs réelles ; sinon fallback sur getAttribute
      if(el.object3D && el.object3D.position){
        const p = el.object3D.position;
        const r = el.object3D.rotation;
        // stocke en degrés pour cohérence avec les rotations dans ton script
        originalData[comp.id] = {
          position: { x: p.x, y: p.y, z: p.z },
          rotation: { x: THREE.MathUtils.radToDeg(r.x), y: THREE.MathUtils.radToDeg(r.y), z: THREE.MathUtils.radToDeg(r.z) }
        };
      } else {
        // fallback à l'attribut HTML (valeur par défaut dans le markup)
        const pos = el.getAttribute('position') || {x:0,y:0,z:0};
        const rot = el.getAttribute('rotation') || {x:0,y:0,z:0};
        originalData[comp.id] = {
          position: { x: pos.x, y: pos.y, z: pos.z },
          rotation: { x: rot.x, y: rot.y, z: rot.z }
        };
      }
    });
  }

  // essaye de capturer après quelques frames pour laisser le temps au chargement des modèles
  function tryCaptureOriginalDataWithDelay(){
    // 3 tentatives espacées si object3D non prêt tout de suite
    let attempts = 0;
    function attempt(){
      captureOriginalDataOnce();
      attempts++;
      // si pas tout capturé et attempts < 3, réessaye au prochain frame
      const missing = components.some(c => !originalData[c.id]);
      if(missing && attempts < 3){
        requestAnimationFrame(attempt);
      } else {
        // si encore manquant, on laisse le fallback getAttribute déjà rempli ci-dessus
        // console.log('originalData ready', originalData);
      }
    }
    attempt();
  }
  tryCaptureOriginalDataWithDelay();

  function resetToOriginal(){
    // Stoppe toute boucle d'explosion
    looping = false;
    if(explodeTimeout) {
      clearTimeout(explodeTimeout);
      explodeTimeout = null;
    }

    components.forEach(comp=>{
      const el = document.getElementById(comp.id);
      if(!el) return;
      const orig = originalData[comp.id] ? originalData[comp.id].position : {x:0,y:0,z:0};
      const origRot = originalData[comp.id] ? originalData[comp.id].rotation : {x:0,y:0,z:0};
      // remettre la position / rotation directement sur object3D (ne dépend pas des animations)
      if(el.object3D){
        el.object3D.position.set(orig.x, orig.y, orig.z);
        el.object3D.rotation.set(
          THREE.MathUtils.degToRad(origRot.x),
          THREE.MathUtils.degToRad(origRot.y),
          THREE.MathUtils.degToRad(origRot.z)
        );
      } else {
        // fallback pour s'assurer que l'attribut A-Frame est aussi mis à jour
        el.setAttribute('position', `${orig.x} ${orig.y} ${orig.z}`);
        el.setAttribute('rotation', `${origRot.x} ${origRot.y} ${origRot.z}`);
      }
      // supprime toutes les animations A-Frame pour éviter état persistant
      el.removeAttribute('animation__pos');
      el.removeAttribute('animation__rot');
      el.removeAttribute('animation__return');
      el.removeAttribute('animation__rot_return');
    });
  }

  function explode(){
    if(!looping) return;

    components.forEach(comp=>{
      const el=document.getElementById(comp.id);
      if(!el) return;
      const orig = originalData[comp.id] ? originalData[comp.id].position : {x:0,y:0,z:0};
      const origRot = originalData[comp.id] ? originalData[comp.id].rotation : {x:0,y:0,z:0};
      const targetPos = {x:orig.x+comp.offset.x, y:orig.y+comp.offset.y, z:orig.z+comp.offset.z};
      const targetRot = {x:origRot.x+(Math.random()-0.5)*60,
                         y:origRot.y+(Math.random()-0.5)*60,
                         z:origRot.z+(Math.random()-0.5)*60};
      el.setAttribute('animation__pos',{property:'position',to:`${targetPos.x} ${targetPos.y} ${targetPos.z}`,dur:1800,easing:'easeOutCubic'});
      el.setAttribute('animation__rot',{property:'rotation',to:`${targetRot.x} ${targetRot.y} ${targetRot.z}`,dur:1800,easing:'easeOutCubic'});
    });

    explodeTimeout = setTimeout(reassemble, 1900);
  }

  function reassemble(){
    if(!looping) return;

    components.forEach(comp=>{
      const el=document.getElementById(comp.id);
      if(!el) return;
      const orig = originalData[comp.id] ? originalData[comp.id].position : {x:0,y:0,z:0};
      const origRot = originalData[comp.id] ? originalData[comp.id].rotation : {x:0,y:0,z:0};
      el.setAttribute('animation__return',{property:'position',to:`${orig.x} ${orig.y} ${orig.z}`,dur:1800,easing:'easeInOutCubic'});
      el.setAttribute('animation__rot_return',{property:'rotation',to:`${origRot.x} ${origRot.y} ${origRot.z}`,dur:1800,easing:'easeInOutCubic'});
    });

    explodeTimeout = setTimeout(explode, 1900);
  }

  // écouteur MindAR
  const targetEntity=document.querySelector('[mindar-image-target]');
  targetEntity.addEventListener('targetFound',()=>{
    // IMPORTANT : on remet tout d'abord les composants à leurs valeurs initiales
    // afin d'éviter de repartir d'un état intermédiaire.
    parent.setAttribute('visible',true);

    // si originalData n'est pas complètement capturé, essaie de capturer maintenant
    captureOriginalDataOnce();

    // garantir position de départ propre
    resetToOriginal();

    // démarrer la boucle
    looping = true;
    // lance l'explosion (qui appellera reassemble -> explode en boucle)
    explode();
  });

  targetEntity.addEventListener('targetLost',()=>{
    parent.setAttribute('visible',false);
    resetToOriginal();
  });
});
</script>

</body>
</html>
