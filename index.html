<script>
AFRAME.registerComponent('look-at-camera',{
  tick: function(){
    const camera=document.querySelector('a-camera');
    if(camera) this.el.object3D.lookAt(camera.object3D.position);
  }
});

document.addEventListener('DOMContentLoaded',()=>{
  const parent=document.querySelector('#enceinte-parent');
  const enceinte=document.getElementById('enceinte');

  const components=[
    {id:'back',offset:{x:0,y:0,z:-200}},
    {id:'Left',offset:{x:-180,y:60,z:0}},
    {id:'Right',offset:{x:180,y:60,z:0}},
    {id:'Batteries',offset:{x:120,y:-70,z:80}},
    {id:'Open',offset:{x:-90,y:40,z:-130}},
    {id:'Speaker',offset:{x:-80,y:-30,z:200}},
    {id:'Led',offset:{x:0,y:180,z:0}},
    {id:'partie-avant',offset:{x:80,y:30,z:240}},
    {id:'bas',offset:{x:0,y:-130,z:0}}
  ];

  const originalData={}; // positions & rotations initiales (local attributes)
  let isActive = false;
  const timeouts = [];

  const WAIT_BEFORE_EXPLODE = 5000;
  const EXPLODE_ANIM_DUR = 1000;
  const FLOAT_DURATION = 5000;
  const REASSEMBLE_ANIM_DUR = 1000;

  function pushTimeout(id){ timeouts.push(id); }
  function clearAllTimeouts(){
    while(timeouts.length) clearTimeout(timeouts.pop());
  }

  // -> Capture STRICTE des valeurs *locales déclarées* (getAttribute)
  function captureOriginalDataOnce(){
    components.forEach(comp=>{
      if(originalData[comp.id]) return;
      const el = document.getElementById(comp.id);
      if(!el) return;

      // preferred: getAttribute returns the local values exactly as in the markup
      const posAttr = el.getAttribute('position');
      const rotAttr = el.getAttribute('rotation');

      if(posAttr && rotAttr && typeof posAttr.x === 'number'){
        originalData[comp.id] = {
          position: { x: Number(posAttr.x), y: Number(posAttr.y), z: Number(posAttr.z) },
          rotation: { x: Number(rotAttr.x), y: Number(rotAttr.y), z: Number(rotAttr.z) }
        };
      } else if (el.object3D && el.object3D.position) {
        // fallback: convert object3D rotation to degrees but prefer attributes
        const p = el.object3D.position;
        const r = el.object3D.rotation;
        originalData[comp.id] = {
          position: { x: Number(p.x), y: Number(p.y), z: Number(p.z) },
          rotation: { x: THREE.MathUtils.radToDeg(r.x), y: THREE.MathUtils.radToDeg(r.y), z: THREE.MathUtils.radToDeg(r.z) }
        };
      } else {
        // ultimate fallback constants
        originalData[comp.id] = {
          position: { x: 0, y: 0, z: 0 },
          rotation: { x: 0, y: 0, z: 0 }
        };
      }
    });
  }

  // -> Remet instantanément via setAttribute (valeurs locales)
  function resetToOriginalInstant(){
    components.forEach(comp=>{
      const el = document.getElementById(comp.id);
      if(!el) return;
      const orig = originalData[comp.id] ? originalData[comp.id].position : {x:0,y:0,z:0};
      const origRot = originalData[comp.id] ? originalData[comp.id].rotation : {x:0,y:0,z:0};

      // utiliser setAttribute afin de conserver les coordonnées locales et le scale du parent
      el.removeAttribute('animation__pos');
      el.removeAttribute('animation__rot');
      el.removeAttribute('animation__float');
      el.removeAttribute('animation__rot_float');
      el.removeAttribute('animation__return');
      el.removeAttribute('animation__rot_return');

      el.setAttribute('position', `${orig.x} ${orig.y} ${orig.z}`);
      el.setAttribute('rotation', `${origRot.x} ${origRot.y} ${origRot.z}`);
      el.setAttribute('visible', true);
    });
  }

  // Lire la position actuelle d'une entité — preferer getAttribute pour rester en local space
  function getCurrentLocalPosition(el, fallbackOrig){
    const pos = el.getAttribute('position');
    if(pos && typeof pos.x === 'number') return { x: pos.x, y: pos.y, z: pos.z };
    return fallbackOrig;
  }

  function explodeOnceAndFloatThenReassemble(){
    if(!isActive) return;

    // explosion: créer animations à partir des positions locales originales
    components.forEach(comp=>{
      const el = document.getElementById(comp.id);
      if(!el) return;
      const orig = originalData[comp.id] ? originalData[comp.id].position : {x:0,y:0,z:0};
      const origRot = originalData[comp.id] ? originalData[comp.id].rotation : {x:0,y:0,z:0};

      // remove anciennes animations pour forcer restart
      el.removeAttribute('animation__pos');
      el.removeAttribute('animation__rot');
      el.removeAttribute('animation__float');
      el.removeAttribute('animation__rot_float');

      // cible d'explosion en local space (original + offset + random)
      const baseTarget = { x: orig.x + comp.offset.x, y: orig.y + comp.offset.y, z: orig.z + comp.offset.z };
      const randSpread = 60;
      const targetPos = {
        x: baseTarget.x + (Math.random()-0.5) * randSpread,
        y: baseTarget.y + (Math.random()-0.5) * randSpread * 0.7,
        z: baseTarget.z + (Math.random()-0.5) * randSpread
      };
      const targetRot = {
        x: origRot.x + (Math.random()-0.5) * 90,
        y: origRot.y + (Math.random()-0.5) * 90,
        z: origRot.z + (Math.random()-0.5) * 90
      };

      // set animations using local attributes (setAttribute)
      el.setAttribute('animation__pos', {
        property: 'position',
        to: `${targetPos.x} ${targetPos.y} ${targetPos.z}`,
        dur: EXPLODE_ANIM_DUR,
        easing: 'easeOutCubic'
      });
      el.setAttribute('animation__rot', {
        property: 'rotation',
        to: `${targetRot.x} ${targetRot.y} ${targetRot.z}`,
        dur: EXPLODE_ANIM_DUR,
        easing: 'easeOutCubic'
      });

      el.setAttribute('visible', true);
    });

    // après explosion -> flotter
    pushTimeout(setTimeout(()=> {
      if(!isActive) return;

      components.forEach(comp=>{
        const el = document.getElementById(comp.id);
        if(!el) return;

        // lire la position courante en local (A-Frame mettra à jour l'attribut position quand l'animation est finie)
        // si getAttribute n'a pas encore le bon état, fallback sur original + offset
        const orig = originalData[comp.id] ? originalData[comp.id].position : {x:0,y:0,z:0};
        const curPos = getCurrentLocalPosition(el, { x: orig.x + comp.offset.x, y: orig.y + comp.offset.y, z: orig.z + comp.offset.z });

        const floatAmp = 20 + Math.random()*40;
        const floatTarget = {
          x: curPos.x + (Math.random()-0.5) * floatAmp,
          y: curPos.y + (Math.random()*floatAmp*0.6),
          z: curPos.z + (Math.random()-0.5) * floatAmp
        };

        // boucle de flottement (alternate, loop)
        el.removeAttribute('animation__float');
        el.setAttribute('animation__float', {
          property: 'position',
          to: `${floatTarget.x} ${floatTarget.y} ${floatTarget.z}`,
          dur: 1200 + Math.floor(Math.random()*800),
          dir: 'alternate',
          loop: true,
          easing: 'easeInOutSine'
        });

        el.removeAttribute('animation__rot_float');
        el.setAttribute('animation__rot_float', {
          property: 'rotation',
          to: `${(Math.random()-0.5)*40} ${(Math.random()-0.5)*40} ${(Math.random()-0.5)*40}`,
          dur: 1800 + Math.floor(Math.random()*1200),
          dir: 'alternate',
          loop: true,
          easing: 'linear'
        });
      });

    }, EXPLODE_ANIM_DUR));

    // planifier le reassemble après EXPLODE_ANIM_DUR + FLOAT_DURATION
    pushTimeout(setTimeout(()=> {
      if(!isActive) return;

      components.forEach(comp=>{
        const el = document.getElementById(comp.id);
        if(!el) return;
        const orig = originalData[comp.id] ? originalData[comp.id].position : {x:0,y:0,z:0};
        const origRot = originalData[comp.id] ? originalData[comp.id].rotation : {x:0,y:0,z:0};

        // enlever flottement et lancer retour vers l'original (via setAttribute animation)
        el.removeAttribute('animation__float');
        el.removeAttribute('animation__rot_float');

        el.setAttribute('animation__return', {
          property: 'position',
          to: `${orig.x} ${orig.y} ${orig.z}`,
          dur: REASSEMBLE_ANIM_DUR,
          easing: 'easeInOutCubic'
        });
        el.setAttribute('animation__rot_return', {
          property: 'rotation',
          to: `${origRot.x} ${origRot.y} ${origRot.z}`,
          dur: REASSEMBLE_ANIM_DUR,
          easing: 'easeInOutCubic'
        });
      });

      // après reassemble, nettoyer et relancer cycle après WAIT_BEFORE_EXPLODE
      pushTimeout(setTimeout(()=> {
        if(!isActive) return;

        components.forEach(comp=>{
          const el=document.getElementById(comp.id);
          if(!el) return;
          el.removeAttribute('animation__pos');
          el.removeAttribute('animation__rot');
          el.removeAttribute('animation__float');
          el.removeAttribute('animation__rot_float');
          el.removeAttribute('animation__return');
          el.removeAttribute('animation__rot_return');

          // garantir la position d'origine exacte via setAttribute
          const orig = originalData[comp.id] ? originalData[comp.id].position : {x:0,y:0,z:0};
          const origRot = originalData[comp.id] ? originalData[comp.id].rotation : {x:0,y:0,z:0};
          el.setAttribute('position', `${orig.x} ${orig.y} ${orig.z}`);
          el.setAttribute('rotation', `${origRot.x} ${origRot.y} ${origRot.z}`);
        });

        if(isActive){
          pushTimeout(setTimeout(()=> {
            if(isActive) explodeOnceAndFloatThenReassemble();
          }, WAIT_BEFORE_EXPLODE));
        }
      }, REASSEMBLE_ANIM_DUR));

    }, EXPLODE_ANIM_DUR + FLOAT_DURATION));
  }

  // MindAR listeners
  const targetEntity = document.querySelector('[mindar-image-target]');

  targetEntity.addEventListener('targetFound',()=>{
    if(isActive) return;
    isActive = true;
    parent.setAttribute('visible', true);

    captureOriginalDataOnce();
    resetToOriginalInstant();

    pushTimeout(setTimeout(()=> {
      if(isActive) explodeOnceAndFloatThenReassemble();
    }, WAIT_BEFORE_EXPLODE));
  });

  targetEntity.addEventListener('targetLost',()=>{
    isActive = false;
    parent.setAttribute('visible', false);
    clearAllTimeouts();
    resetToOriginalInstant();
  });

  // tenter de capturer plusieurs fois (laisser le temps au chargement)
  (function tryCaptureSeveralFrames(){
    let attempts = 0;
    function attempt(){
      captureOriginalDataOnce();
      attempts++;
      const missing = components.some(c => !originalData[c.id]);
      if(missing && attempts < 6){
        requestAnimationFrame(attempt);
      }
    }
    attempt();
  })();

});
</script>
