<script>
AFRAME.registerComponent('look-at-camera',{
  tick: function(){
    const camera=document.querySelector('a-camera');
    if(camera) this.el.object3D.lookAt(camera.object3D.position);
  }
});

document.addEventListener('DOMContentLoaded',()=>{
  const parent=document.querySelector('#enceinte-parent');
  const enceinte=document.getElementById('enceinte');

  // LISTE DES PIÈCES + POSITIONS INDISPENSABLES (positions de DÉPART absolues en local space)
  const components=[
    {id:'back', startPos:{x:0,y:0,z:-200}, offset:{x:0,y:0,z:-200}},
    {id:'Left', startPos:{x:-180,y:60,z:0}, offset:{x:-180,y:60,z:0}},
    {id:'Right', startPos:{x:180,y:60,z:0}, offset:{x:180,y:60,z:0}},
    {id:'Batteries', startPos:{x:120,y:-70,z:80}, offset:{x:120,y:-70,z:80}},
    {id:'Open', startPos:{x:-90,y:40,z:-130}, offset:{x:-90,y:40,z:-130}},
    {id:'Speaker', startPos:{x:-80,y:-30,z:200}, offset:{x:-80,y:-30,z:200}},
    {id:'Led', startPos:{x:0,y:180,z:0}, offset:{x:0,y:180,z:0}},
    {id:'partie-avant', startPos:{x:80,y:30,z:240}, offset:{x:80,y:30,z:240}},
    {id:'bas', startPos:{x:0,y:-130,z:0}, offset:{x:0,y:-130,z:0}}
  ];

  // stocke la "vérité" des positions & rotations (nous forçons les positions fournies ci-dessus)
  const originalData = {};
  let isActive = false;
  const timeouts = [];

  // Durées (modifiable)
  const WAIT_BEFORE_EXPLODE = 5000;  // attendre 5s avant explosion
  const EXPLODE_ANIM_DUR = 1000;
  const FLOAT_DURATION = 5000;      // 5s de flottement
  const REASSEMBLE_ANIM_DUR = 1000;

  function pushTimeout(id){ timeouts.push(id); }
  function clearAllTimeouts(){
    while(timeouts.length) clearTimeout(timeouts.pop());
  }

  // Initialise les positions dans le DOM avec les valeurs "startPos" fournies,
  // et remplit originalData avec ces mêmes positions (et rotations à 0 par défaut).
  function enforceStartPositions(){
    components.forEach(comp=>{
      const el = document.getElementById(comp.id);
      if(!el) return;
      const p = comp.startPos;
      // on force la position déclarée (setAttribute -> mode local, respecte scale parent)
      el.setAttribute('position', `${p.x} ${p.y} ${p.z}`);
      // on met rotation à 0 par défaut (tu peux personnaliser si besoin)
      const rot = el.getAttribute('rotation') || {x:0,y:0,z:0};
      // si tu veux forcer rotation précise, change ci-dessous :
      el.setAttribute('rotation', `${rot.x} ${rot.y} ${rot.z}`);

      // stocker la vérité
      originalData[comp.id] = {
        position: { x: Number(p.x), y: Number(p.y), z: Number(p.z) },
        rotation: { x: Number(rot.x), y: Number(rot.y), z: Number(rot.z) }
      };

      // s'assurer visibles au départ
      el.setAttribute('visible', true);
      // nettoyage éventuel d'anciennes animations
      el.removeAttribute('animation__pos');
      el.removeAttribute('animation__rot');
      el.removeAttribute('animation__float');
      el.removeAttribute('animation__rot_float');
      el.removeAttribute('animation__return');
      el.removeAttribute('animation__rot_return');
    });
  }

  // Remet instantanément chaque entité EXACTEMENT à originalData (en utilisant setAttribute)
  function resetToOriginalInstant(){
    components.forEach(comp=>{
      const el = document.getElementById(comp.id);
      if(!el) return;
      const orig = originalData[comp.id] ? originalData[comp.id].position : comp.startPos;
      const origRot = originalData[comp.id] ? originalData[comp.id].rotation : {x:0,y:0,z:0};
      // supprimer toutes animations pour éviter états persistants
      el.removeAttribute('animation__pos');
      el.removeAttribute('animation__rot');
      el.removeAttribute('animation__float');
      el.removeAttribute('animation__rot_float');
      el.removeAttribute('animation__return');
      el.removeAttribute('animation__rot_return');

      // setter via setAttribute pour respecter l'espace local (scale du parent conservé)
      el.setAttribute('position', `${orig.x} ${orig.y} ${orig.z}`);
      el.setAttribute('rotation', `${origRot.x} ${origRot.y} ${origRot.z}`);
      el.setAttribute('visible', true);
    });
  }

  // Fonction principale : explosion -> float -> reassemble -> relance
  function explodeOnceAndFloatThenReassemble(){
    if(!isActive) return;

    // Explosion: on crée des animations position/rotation vers des cibles calculées
    components.forEach(comp=>{
      const el = document.getElementById(comp.id);
      if(!el) return;
      const orig = originalData[comp.id].position;
      // calcul d'une cible d'explosion (base = orig + offset initial fourni, + random)
      const randSpread = 60;
      const targetPos = {
        x: orig.x + (Math.random()-0.5) * randSpread,
        y: orig.y + Math.abs((Math.random()-0.5) * randSpread) + 20, // tendance à monter
        z: orig.z + (Math.random()-0.5) * randSpread
      };
      const targetRot = {
        x: (Math.random()-0.5) * 90,
        y: (Math.random()-0.5) * 90,
        z: (Math.random()-0.5) * 90
      };

      // nettoyage pour forcer le redémarrage de l'animation
      el.removeAttribute('animation__pos');
      el.removeAttribute('animation__rot');

      // s'assurer visible
      el.setAttribute('visible', true);

      // animation explosion (part de la valeur locale actuelle pour aller vers targetPos)
      el.setAttribute('animation__pos', {
        property: 'position',
        to: `${targetPos.x} ${targetPos.y} ${targetPos.z}`,
        dur: EXPLODE_ANIM_DUR,
        easing: 'easeOutCubic'
      });
      el.setAttribute('animation__rot', {
        property: 'rotation',
        to: `${targetRot.x} ${targetRot.y} ${targetRot.z}`,
        dur: EXPLODE_ANIM_DUR,
        easing: 'easeOutCubic'
      });
    });

    // après la fin de l'explosion -> lancement du flottement en boucle
    pushTimeout(setTimeout(()=> {
      if(!isActive) return;

      components.forEach(comp=>{
        const el = document.getElementById(comp.id);
        if(!el) return;

        // lecture de la position locale courante (getAttribute renvoie la position locale que les animations modifient)
        const curPosAttr = el.getAttribute('position');
        const curPos = (curPosAttr && typeof curPosAttr.x === 'number') ?
                        {x:curPosAttr.x, y:curPosAttr.y, z:curPosAttr.z} :
                        originalData[comp.id].position;

        // amplitude de flottement individuelle pour réduire chevauchements
        const floatAmp = 20 + Math.random()*40;
        const floatTarget = {
          x: curPos.x + (Math.random()-0.5) * floatAmp,
          y: curPos.y + (Math.random()*floatAmp*0.6),
          z: curPos.z + (Math.random()-0.5) * floatAmp
        };

        // mettre une animation en loop alternate (oscillation)
        el.removeAttribute('animation__float');
        el.setAttribute('animation__float', {
          property: 'position',
          to: `${floatTarget.x} ${floatTarget.y} ${floatTarget.z}`,
          dur: 1200 + Math.floor(Math.random()*800),
          dir: 'alternate',
          loop: true,
          easing: 'easeInOutSine'
        });

        // rotation lente en boucle
        el.removeAttribute('animation__rot_float');
        el.setAttribute('animation__rot_float', {
          property: 'rotation',
          to: `${(Math.random()-0.5)*40} ${(Math.random()-0.5)*40} ${(Math.random()-0.5)*40}`,
          dur: 1800 + Math.floor(Math.random()*1200),
          dir: 'alternate',
          loop: true,
          easing: 'linear'
        });
      });

    }, EXPLODE_ANIM_DUR));

    // Planifier le re-assemblage après EXPLODE_ANIM_DUR + FLOAT_DURATION
    pushTimeout(setTimeout(()=> {
      if(!isActive) return;

      components.forEach(comp=>{
        const el = document.getElementById(comp.id);
        if(!el) return;
        const orig = originalData[comp.id].position;
        const origRot = originalData[comp.id].rotation;

        // supprimer animations de flottement
        el.removeAttribute('animation__float');
        el.removeAttribute('animation__rot_float');

        // lancer animation de retour vers la position forcée (originalData)
        el.removeAttribute('animation__return');
        el.removeAttribute('animation__rot_return');
        el.setAttribute('animation__return', {
          property: 'position',
          to: `${orig.x} ${orig.y} ${orig.z}`,
          dur: REASSEMBLE_ANIM_DUR,
          easing: 'easeInOutCubic'
        });
        el.setAttribute('animation__rot_return', {
          property: 'rotation',
          to: `${origRot.x} ${origRot.y} ${origRot.z}`,
          dur: REASSEMBLE_ANIM_DUR,
          easing: 'easeInOutCubic'
        });
      });

      // après la fin du reassemble, nettoyer et relancer le cycle si on est toujours actif
      pushTimeout(setTimeout(()=> {
        if(!isActive) return;

        // nettoyage et forçage des positions EXACTES (en cas de petites dérives)
        components.forEach(comp=>{
          const el = document.getElementById(comp.id);
          if(!el) return;
          el.removeAttribute('animation__pos');
          el.removeAttribute('animation__rot');
          el.removeAttribute('animation__float');
          el.removeAttribute('animation__rot_float');
          el.removeAttribute('animation__return');
          el.removeAttribute('animation__rot_return');

          const orig = originalData[comp.id].position;
          const origRot = originalData[comp.id].rotation;
          el.setAttribute('position', `${orig.x} ${orig.y} ${orig.z}`);
          el.setAttribute('rotation', `${origRot.x} ${origRot.y} ${origRot.z}`);
          el.setAttribute('visible', true);
        });

        // relancer après délai d'attente
        if(isActive){
          pushTimeout(setTimeout(()=> {
            if(isActive) explodeOnceAndFloatThenReassemble();
          }, WAIT_BEFORE_EXPLODE));
        }
      }, REASSEMBLE_ANIM_DUR));

    }, EXPLODE_ANIM_DUR + FLOAT_DURATION));
  }

  // LISTERNS MINDAR
  const targetEntity = document.querySelector('[mindar-image-target]');

  // Au chargement : forcer les positions de départ dans le DOM
  enforceStartPositions();

  targetEntity.addEventListener('targetFound', ()=>{
    if(isActive) return;
    isActive = true;
    parent.setAttribute('visible', true);

    // ré-enforcer les positions (au cas où)
    enforceStartPositions();
    resetToOriginalInstant();

    // lancer cycle: attendre 5s puis exploser
    pushTimeout(setTimeout(()=>{
      if(isActive) explodeOnceAndFloatThenReassemble();
    }, WAIT_BEFORE_EXPLODE));
  });

  targetEntity.addEventListener('targetLost', ()=>{
    // stoppe tout et remet TOUTES les pièces strictement à startPos
    isActive = false;
    parent.setAttribute('visible', false);
    clearAllTimeouts();
    // retirer animations et forcer positions de départ
    resetToOriginalInstant();
    enforceStartPositions();
  });

  // sécurité : si des modèles chargent après coup, on ré-applique startPositions quelques frames
  // pour s'assurer que le DOM reflète bien les positions voulues.
  let safetyAttempts = 0;
  function safetyEnforce(){
    enforceStartPositions();
    safetyAttempts++;
    if(safetyAttempts < 4) requestAnimationFrame(safetyEnforce);
  }
  safetyEnforce();

});
</script>
