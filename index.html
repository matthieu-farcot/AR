<script>
AFRAME.registerComponent('look-at-camera',{
  tick: function(){
    const camera = document.querySelector('a-camera');
    if (camera) this.el.object3D.lookAt(camera.object3D.position);
  }
});

(function(){
  // Constantes / configuration
  const WAIT_BEFORE_EXPLODE = 5000;  // ms
  const EXPLODE_ANIM_DUR = 1000;
  const FLOAT_DURATION = 5000;
  const REASSEMBLE_ANIM_DUR = 1000;
  const MAX_TARGET_WAIT_ATTEMPTS = 30; // sécurité pour ne pas boucler indéfiniment

  // DEFINIT LES POSITIONS DE DÉPART OBLIGATOIRES (la "vérité")
  const components = [
    {id:'back', startPos:{x:0,y:0,z:-200}, offset:{x:0,y:0,z:-200}},
    {id:'Left', startPos:{x:-180,y:60,z:0}, offset:{x:-180,y:60,z:0}},
    {id:'Right', startPos:{x:180,y:60,z:0}, offset:{x:180,y:60,z:0}},
    {id:'Batteries', startPos:{x:120,y:-70,z:80}, offset:{x:120,y:-70,z:80}},
    {id:'Open', startPos:{x:-90,y:40,z:-130}, offset:{x:-90,y:40,z:-130}},
    {id:'Speaker', startPos:{x:-80,y:-30,z:200}, offset:{x:-80,y:-30,z:200}},
    {id:'Led', startPos:{x:0,y:180,z:0}, offset:{x:0,y:180,z:0}},
    {id:'partie-avant', startPos:{x:80,y:30,z:240}, offset:{x:80,y:30,z:240}},
    {id:'bas', startPos:{x:0,y:-130,z:0}, offset:{x:0,y:-130,z:0}}
  ];

  // état
  const originalData = {};
  let isActive = false;
  const timeouts = [];

  function pushTimeout(id){ timeouts.push(id); }
  function clearAllTimeouts(){ while(timeouts.length) clearTimeout(timeouts.pop()); }

  // Force startPos dans le DOM (setAttribute local space) et stocke originalData
  function enforceStartPositions(){
    components.forEach(comp=>{
      const el = document.getElementById(comp.id);
      if(!el) return;
      const p = comp.startPos;
      el.setAttribute('position', `${p.x} ${p.y} ${p.z}`);
      // garder rotation existante si présente, sinon 0 0 0
      const rot = el.getAttribute('rotation') || {x:0,y:0,z:0};
      el.setAttribute('rotation', `${rot.x} ${rot.y} ${rot.z}`);
      originalData[comp.id] = {
        position: { x: Number(p.x), y: Number(p.y), z: Number(p.z) },
        rotation: { x: Number(rot.x), y: Number(rot.y), z: Number(rot.z) }
      };
      el.setAttribute('visible', true);
      // nettoyage animations résiduelles
      el.removeAttribute('animation__pos');
      el.removeAttribute('animation__rot');
      el.removeAttribute('animation__float');
      el.removeAttribute('animation__rot_float');
      el.removeAttribute('animation__return');
      el.removeAttribute('animation__rot_return');
    });
  }

  function resetToOriginalInstant(){
    components.forEach(comp=>{
      const el = document.getElementById(comp.id);
      if(!el) return;
      const orig = originalData[comp.id] ? originalData[comp.id].position : comp.startPos;
      const origRot = originalData[comp.id] ? originalData[comp.id].rotation : {x:0,y:0,z:0};
      el.removeAttribute('animation__pos');
      el.removeAttribute('animation__rot');
      el.removeAttribute('animation__float');
      el.removeAttribute('animation__rot_float');
      el.removeAttribute('animation__return');
      el.removeAttribute('animation__rot_return');
      el.setAttribute('position', `${orig.x} ${orig.y} ${orig.z}`);
      el.setAttribute('rotation', `${origRot.x} ${origRot.y} ${origRot.z}`);
      el.setAttribute('visible', true);
    });
  }

  // Récupère la position locale courante via getAttribute (fallback original)
  function getCurrentLocalPosition(el, fallback){
    const pos = el.getAttribute('position');
    if(pos && typeof pos.x === 'number') return {x: pos.x, y: pos.y, z: pos.z};
    return fallback;
  }

  function explodeOnceAndFloatThenReassemble(){
    if(!isActive) return;

    // Explosion: animation vers target calculés en local space
    components.forEach(comp=>{
      const el = document.getElementById(comp.id);
      if(!el) return;
      const orig = originalData[comp.id].position;
      const randSpread = 60;
      const targetPos = {
        x: orig.x + (Math.random()-0.5) * randSpread,
        y: orig.y + Math.abs((Math.random()-0.5) * randSpread) + 20,
        z: orig.z + (Math.random()-0.5) * randSpread
      };
      const targetRot = {
        x: (Math.random()-0.5) * 90,
        y: (Math.random()-0.5) * 90,
        z: (Math.random()-0.5) * 90
      };
      el.removeAttribute('animation__pos');
      el.removeAttribute('animation__rot');
      el.setAttribute('animation__pos', {
        property: 'position',
        to: `${targetPos.x} ${targetPos.y} ${targetPos.z}`,
        dur: EXPLODE_ANIM_DUR,
        easing: 'easeOutCubic'
      });
      el.setAttribute('animation__rot', {
        property: 'rotation',
        to: `${targetRot.x} ${targetRot.y} ${targetRot.z}`,
        dur: EXPLODE_ANIM_DUR,
        easing: 'easeOutCubic'
      });
      el.setAttribute('visible', true);
    });

    // après explosion -> flottement en boucle
    pushTimeout(setTimeout(()=> {
      if(!isActive) return;
      components.forEach(comp=>{
        const el = document.getElementById(comp.id);
        if(!el) return;
        const orig = originalData[comp.id].position;
        const curPos = getCurrentLocalPosition(el, { x: orig.x + comp.offset.x, y: orig.y + comp.offset.y, z: orig.z + comp.offset.z });
        const floatAmp = 20 + Math.random()*40;
        const floatTarget = {
          x: curPos.x + (Math.random()-0.5) * floatAmp,
          y: curPos.y + (Math.random()*floatAmp*0.6),
          z: curPos.z + (Math.random()-0.5) * floatAmp
        };
        el.removeAttribute('animation__float');
        el.setAttribute('animation__float', {
          property: 'position',
          to: `${floatTarget.x} ${floatTarget.y} ${floatTarget.z}`,
          dur: 1200 + Math.floor(Math.random()*800),
          dir: 'alternate',
          loop: true,
          easing: 'easeInOutSine'
        });
        el.removeAttribute('animation__rot_float');
        el.setAttribute('animation__rot_float', {
          property: 'rotation',
          to: `${(Math.random()-0.5)*40} ${(Math.random()-0.5)*40} ${(Math.random()-0.5)*40}`,
          dur: 1800 + Math.floor(Math.random()*1200),
          dir: 'alternate',
          loop: true,
          easing: 'linear'
        });
      });
    }, EXPLODE_ANIM_DUR));

    // planifier reassemble
    pushTimeout(setTimeout(()=> {
      if(!isActive) return;
      components.forEach(comp=>{
        const el = document.getElementById(comp.id);
        if(!el) return;
        const orig = originalData[comp.id].position;
        const origRot = originalData[comp.id].rotation;
        el.removeAttribute('animation__float');
        el.removeAttribute('animation__rot_float');
        el.setAttribute('animation__return', {
          property: 'position',
          to: `${orig.x} ${orig.y} ${orig.z}`,
          dur: REASSEMBLE_ANIM_DUR,
          easing: 'easeInOutCubic'
        });
        el.setAttribute('animation__rot_return', {
          property: 'rotation',
          to: `${origRot.x} ${origRot.y} ${origRot.z}`,
          dur: REASSEMBLE_ANIM_DUR,
          easing: 'easeInOutCubic'
        });
      });

      // après reassembly, forcer positions EXACTES et relancer cycle
      pushTimeout(setTimeout(()=> {
        if(!isActive) return;
        components.forEach(comp=>{
          const el = document.getElementById(comp.id);
          if(!el) return;
          // cleanup
          el.removeAttribute('animation__pos');
          el.removeAttribute('animation__rot');
          el.removeAttribute('animation__float');
          el.removeAttribute('animation__rot_float');
          el.removeAttribute('animation__return');
          el.removeAttribute('animation__rot_return');
          const orig = originalData[comp.id].position;
          const origRot = originalData[comp.id].rotation;
          el.setAttribute('position', `${orig.x} ${orig.y} ${orig.z}`);
          el.setAttribute('rotation', `${origRot.x} ${origRot.y} ${origRot.z}`);
          el.setAttribute('visible', true);
        });

        if(isActive){
          pushTimeout(setTimeout(()=> {
            if(isActive) explodeOnceAndFloatThenReassemble();
          }, WAIT_BEFORE_EXPLODE));
        }
      }, REASSEMBLE_ANIM_DUR));
    }, EXPLODE_ANIM_DUR + FLOAT_DURATION));
  }

  // --- WAIT for AFRAME scene + mindar target entity to be ready ---
  function initWhenReady(){
    const scene = document.querySelector('a-scene');
    if(!scene) {
      console.warn('a-scene non trouvé, nouvelle tentative dans 200ms');
      setTimeout(initWhenReady, 200);
      return;
    }

    // attendre événement 'loaded' de la scène pour garantir que MindAR s'initialise
    if(!scene.hasLoaded) {
      scene.addEventListener('loaded', () => {
        // petite latence pour laisser MindAR attacher ses composants internes
        setTimeout(initWhenReadyAfterSceneLoaded, 50);
      });
    } else {
      setTimeout(initWhenReadyAfterSceneLoaded, 50);
    }
  }

  function initWhenReadyAfterSceneLoaded(){
    let attempts = 0;
    function tryFindTarget(){
      attempts++;
      const targetEntity = document.querySelector('[mindar-image-target]');
      const parent = document.querySelector('#enceinte-parent');
      if(!targetEntity || !parent){
        if(attempts < MAX_TARGET_WAIT_ATTEMPTS){
          // réessayer
          setTimeout(tryFindTarget, 200);
          return;
        } else {
          console.error('Impossible de trouver [mindar-image-target] ou #enceinte-parent après plusieurs tentatives.');
          return;
        }
      }

      // Une fois target trouvé, on applique les positions de départ forcées et on branche les events
      enforceStartPositions();
      resetToOriginalInstant();

      // handler targetFound
      targetEntity.addEventListener('targetFound', ()=>{
        if(isActive) return;
        isActive = true;
        parent.setAttribute('visible', true);
        // ré-imposer positions au moment de la détection (sécurité)
        enforceStartPositions();
        resetToOriginalInstant();
        // attendre WAIT_BEFORE_EXPLODE puis lancer la séquence
        pushTimeout(setTimeout(()=> {
          if(isActive) explodeOnceAndFloatThenReassemble();
        }, WAIT_BEFORE_EXPLODE));
      });

      // handler targetLost
      targetEntity.addEventListener('targetLost', ()=>{
        isActive = false;
        parent.setAttribute('visible', false);
        clearAllTimeouts();
        resetToOriginalInstant();
        enforceStartPositions();
      });

      // sécurité : ré-appliquer start positions quelques frames pour s'assurer qu'aucun loader les écrase
      let safety = 0;
      function safetyEnforce(){
        enforceStartPositions();
        safety++;
        if(safety < 4) requestAnimationFrame(safetyEnforce);
      }
      safetyEnforce();
    }

    tryFindTarget();
  }

  // kick off
  initWhenReady();

})();
</script>
